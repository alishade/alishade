<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Madrid. Enseño a niñas y niños de Primaria a programar y construir robots, y desarrollo aplicaciones con Swift y TypeScript.">
  <style>
    .lab { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 3.5px; }
    .ser { font-family: Georgia, 'Times New Roman', serif; font-size: 36px; }
  </style>
  <rect width="1200" height="250" rx="28" fill="#A85F4E"/>
  <!-- bloques decorativos -->
  <rect x="-40" y="34" width="150" height="30" rx="15" fill="#FAF5EF" opacity=".10"/>
  <rect x="-40" y="74" width="96" height="30" rx="15" fill="#FAF5EF" opacity=".07"/>
  <rect x="1090" y="146" width="150" height="30" rx="15" fill="#FAF5EF" opacity=".10"/>
  <rect x="1144" y="186" width="96" height="30" rx="15" fill="#FAF5EF" opacity=".07"/>
  <!-- ubicación -->
  <g transform="translate(548 62)">
    <path d="M0 -13 C-7 -13 -11 -8 -11 -3 C-11 4 0 13 0 13 C0 13 11 4 11 -3 C11 -8 7 -13 0 -13 Z" fill="none" stroke="#F3D9CF" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="0" cy="-3" r="3.2" fill="#F3D9CF"/>
  </g>
  <text x="570" y="68" class="lab" fill="#F3D9CF">MADRID</text>
  <text x="600" y="132" class="ser" fill="#FAF5EF" text-anchor="middle">Enseño a niñas y niños de Primaria a programar y construir robots,</text>
  <text x="600" y="180" class="ser" fill="#FAF5EF" text-anchor="middle">y desarrollo aplicaciones con Swift y TypeScript.</text>
</svg>
